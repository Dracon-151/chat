<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mildret</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-viewport">

    <!-- SMARTPHONE MOCKUP FRAME -->
    <main class="phone-frame" id="phoneFrame">

      <!-- Camera Punch Hole -->
      <div class="camera-punch"></div>

      <!-- ANDROID STATUS BAR -->
      <header class="status-bar">
        <div class="status-left">
          <span class="status-time" id="clockTime">11:03</span>
          <!-- Alarm icon -->
          <svg class="status-icon-small" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4a8 8 0 108 8 8.01 8.01 0 00-8-8zm.5 4.5v3.69l2.6 1.55-.75 1.26-3.35-2V8.5zM4.9 3.5l3.2 2.4-1.2 1.6-3.2-2.4zm14.2 0l1.2 1.6-3.2 2.4-1.2-1.6z"/>
          </svg>
          <!-- Message notification icon -->
          <svg class="status-icon-small" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
          </svg>
        </div>

        <div class="status-right">
          <!-- Bluetooth icon -->
          <svg class="status-icon-small" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
          </svg>
          <!-- VoLTE 4G+ icon -->
          <span style="font-size: 10px; font-weight: 800; letter-spacing: -0.5px;">Vo<br style="line-height:0">LTE</span>
          <span style="font-size: 11px; font-weight: 800;">4G+</span>
          <!-- Wifi icon -->
          <svg class="status-icon-small" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4zm0 3c3.8 0 7.25 1.5 9.8 3.96L12 18.8 2.2 10.96C4.75 8.5 8.2 7 12 7z"/>
          </svg>
          <!-- Battery icon with percentage -->
          <span class="battery-text">32%</span>
          <svg class="status-icon-small" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z" opacity="0.3"/>
            <path d="M7 16v4.67C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V16H7z"/>
          </svg>
        </div>
      </header>

      <!-- TINDER APP HEADER -->
      <section class="tinder-header">
        <div class="header-left">
          <div class="btn-back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
          
          <div class="user-profile-header">
            <div class="header-avatar-wrap">
              <img src="avatar_circle.png" alt="Mildret" class="header-avatar" onerror="this.src='mildret_avatar.png'">
            </div>
            <div class="header-user-info">
              <h1 class="header-user-name">Mildret</h1>
              <!-- Tinder Blue Verified Badge -->
              <span class="verified-badge">
                <svg viewBox="0 0 24 24" width="20" height="20">
                  <path fill="#007aff" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.8 14.5l-4.2-4.2 1.4-1.4 2.8 2.8 7.2-7.2 1.4 1.4-8.6 8.6z"/>
                </svg>
              </span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <div class="btn-header-action video-call">
            <!-- Video camera SVG -->
            <svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
            </svg>
          </div>
          <div class="btn-header-action">
            <!-- Three dots horizontal SVG -->
            <svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="5" cy="12" r="2.2"/>
              <circle cx="12" cy="12" r="2.2"/>
              <circle cx="19" cy="12" r="2.2"/>
            </svg>
          </div>
        </div>
      </section>

      <!-- CHAT CONVERSATION CONTAINER -->
      <section class="chat-container" id="chatContainer">
        <!-- Date Header -->
        <div class="chat-date-separator" id="chatDate">
          mié, 13 nov 2024, 11:03 p. m.
        </div>

        <!-- Chat Feed (Messages injected dynamically) -->
        <div id="messagesFeed"></div>

        <!-- Typing Indicator (Simulating Mildret writing) -->
        <div class="typing-row" id="typingIndicator" style="display: none;">
          <div class="avatar-spacer">
            <img src="avatar_circle.png" alt="Mildret" class="msg-avatar" onerror="this.src='mildret_avatar.png'">
          </div>
          <div class="typing-bubble">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </section>

      <!-- TINDER INPUT BAR (BOTTOM) -->
      <footer class="tinder-input-area">
        <div class="btn-gif" id="btnGif">GIF</div>
        
        <div class="input-pill-wrapper" id="inputPillWrapper">
          <div class="input-text-display placeholder" id="inputTextDisplay">Escribe un mensaje...</div>
          <button class="btn-send" id="btnSend" tabindex="-1">Enviar</button>
        </div>
      </footer>

      <!-- ANDROID NAVIGATION BAR (BOTTOM) -->
      <nav class="android-nav-bar">
        <div class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 5h3v14H4zm6 0h3v14h-3zm6 0h3v14h-3z"/>
          </svg>
        </div>
        <div class="nav-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" rx="4">
            <rect x="4" y="4" width="16" height="16" rx="4"/>
          </svg>
        </div>
        <div class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </div>
      </nav>

    </main>
  </div>

  <!-- Conversation Data & Logic Scripts -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
